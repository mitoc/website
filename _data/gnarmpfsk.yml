  - link: https://thetech.com/2013/04/23/memorials-v133-n20
    title: "MIT remembers Officer Sean Collier"
    source: The Tech
    author: Greg Steinbrecher
    date: "2013-04-23"
    summary: "Officer Sean Collier, killed on campus on April 18, 2013, was a member of the Outing Club. Police Chief John DiFava listed the club among his involvements, alongside the department's IT operations and a local homeless shelter. Michele Pratusevich '13, who became friends with him through the club, set up a place for people to share memories of him; it had taken more than 170 within days."
    type: "News article"


  - link: https://thetech.com/2009/10/09/running-v129-n43
    title: "MIT Outing Club Wins 19-Mile Relay Race, Ignores Relay Aspect"
    source: The Tech
    author: Eric Gilbertson
    date: "2009-10-09"
    image: /images/gnarmpfsk/articles/the-tech-2009-relay-race.jpg
    summary: "The Crazy Alpine Beavers won the 4th annual intercollegiate Presidential Range Relay Race in 4 hours 32 minutes, more than half an hour ahead of the next of thirteen teams. Every other team ran it as a three-by-six-mile relay; the Beavers covered all 19 miles without a single exchange. Bad weather moved the course to Franconia Ridge, where 40 mph winds, rain and snow met the runners."
    type: "News article"


