# Archive documents shown on /about/gnarmpfsk.
#
# drive:        Google Drive file ID (the part after /file/d/ in its link). The
#               file must be shared as "Anyone with the link can view".
# date:         YYYY-MM-DD, used for sorting and the year filter. Leave it out
#               for undated documents; they are listed last.
#               For approximate dates, pick a best guess and set date_display.
# date_display: optional; shown instead of the formatted date (e.g. "c. 1980").
# type:         exactly one of the types listed below.
#
# External articles use `link` instead of `drive`, plus `image` (a resized copy
# saved in /images/gnarmpfsk/articles/), `source` (the publication), `summary`,
# and optionally `author` and `note` (a caveat shown under the link, e.g. when
# the link goes to a whole issue rather than the article itself).
#
# Articles we transcribed ourselves are not listed here at all: they are pages
# under _pages/about/gnarmpfsk/articles/ and the listing picks them up from
# their own front matter. See /about/gnarmpfsk/tech-archive for the full index
# of Tech issues that mention the club.

types:
  - GNARMPFSK
  - News article
  - Stories
  - Other
documents:
  - link: https://news.mit.edu/2021/climbing-new-heights-school-of-rock-mit-outing-club-1208
    title: "Climbing new heights across New England"
    source: MIT News
    author: Stephanie Tran, Division of Student Life
    date: "2021-12-08"
    image: /images/gnarmpfsk/articles/mit-news-2021-school-of-rock.jpg
    summary: "Since 2014, MIT Outing Club members — new and advanced outdoor enthusiasts — come together for School of Rock, a program teaching and advancing outdoor rock-climbing skills."
    type: "News article"


  - link: https://thetech.com/2017/03/23/mit-hosts-summit
    title: "Reaching for the SumMIT"
    source: The Tech
    author: Catherine Yun
    date: "2017-03-23"
    image: /images/gnarmpfsk/articles/the-tech-2017-summit.jpg
    summary: "Seventy-five climbers competed in MITOC's annual bouldering competition, across recreational, intermediate and advanced divisions for men and women. After four years at off-campus gyms the organizers brought SumMIT home to the Walker Memorial wall, replacing old t-nuts, cleaning every hold and buying new volumes to get it competition-ready."
    type: "News article"


