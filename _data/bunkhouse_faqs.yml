- id: timeline
  title: Timeline and construction
  questions:
    - question: What are the phases of the project?
      answer: |
        * **Phase 0: design (2019--2021).** MITOC worked with Maclay Architects on the initial bunkhouse design. This was funded and completed before the fundraising campaign launched.
        * **Phase 1: site work (2022--2025).** Fundraising from 2022 to 2024 raised %phase1_raised%. In 2024 and 2025 we built the new parking lot, bridge, and access trail, and completed the final construction drawings for the bunkhouse.
        * **Phase 2: the bunkhouse (2026--2027).** We're raising %phase2_cost% to build the bunkhouse itself, breaking ground in %groundbreaking% and finishing in %completion%.

    - question: When will construction start?
      answer: |
        It already has! In Spring 2025, we completed Phase 1: the new parking lot, access trail, and bridge.

        For Phase 2, construction of the bunkhouse itself, more fundraising is needed. We plan to break ground in %groundbreaking%, once the full %total_cost% has been raised.

    - question: How long will construction take?
      answer: |
        The bunkhouse can be built in a single construction season, from about May to November. If we break ground in %groundbreaking% as planned, the bunkhouse will be complete in %completion%.

    - question: What construction method will be used for the bunkhouse?
      answer: |
        The bunkhouse will be an above-grade wooden structure with exterior rigid insulation and back-ventilated cladding, supported by concrete piers and with a small concrete basement to house the fire sprinkler tank and toilet composters below the frost line.

    - question: Will students be involved in construction? Alums?
      answer: |
        The new bunkhouse will be built by a professional general contractor, and their legal requirements for the worksite will require MITOC member participation to be structured and premeditated. Nevertheless, where possible, we plan to involve MITOC members in the construction process.

- id: building
  title: Building and site
  questions:
    - question: Will the bunkhouse be heated?
      answer: |
        The bunkhouse will be tightly insulated with modern building materials, and our calculations indicate that heating will not be required to maintain a comfortable temperature overnight. That said, the bunkhouse will be equipped with electric heat to assist with initial heat-up when the first occupants arrive on the coldest nights.

    - question: How long will the bunkhouse last?
      answer: |
        We expect the bunkhouse to last about 100 years, allowing it to serve MITOC members for many generations to come. The design has been optimized for robustness in many different aspects: exterior rigid insulation (to maintain structural members at a controlled temperature and humidity), generous roof overhangs, and durable cladding materials, to name a few.

    - question: What about parking?
      answer: |
        At the request of the town of Groton, we built a new gravel off-street parking lot with room for %parking_spaces% cars as part of Phase 1, in 2024--25. While this added some construction cost, it improved our relationship with our neighbors and gives Camelot visitors a better place to park.

    - question: Will there be vehicle access to the bunkhouse?
      answer: |
        Regular property users will continue to park their vehicles near North Groton Road and hike in %walk_from_parking% to reach the Camelot buildings.  The bunkhouse access trail has steep grades and a loose surface, but seasonal access by construction vehicles may be possible.

- id: people
  title: Who's involved
  questions:
    - question: Who's running the project?
      old_ids: [who-designed-the-new-bunkhouse, who-is-managing-this-project]
      answer: |
        The project is led by volunteers from the MITOC community, with active participation from MIT Facilities and the MIT Division of Student Life. The design is by Maclay Architects. For names and roles, see [Bunkhouse team](/camelot/about#leaders) on the About page.

    - question: Who should I contact with a different question?
      answer: |
        Please email mitoc-bunkhouse@mit.edu.
