- id: why
  title: Why a bunkhouse?
  questions:
    - question: What is the long-term vision for the Camelot property?
      answer: |
        The long-term vision is for Camelot to host groups of up to %bunkhouse_capacity% people using two structures on the property: a sleeping cabin (the new bunkhouse), and a kitchen/lounge building (the existing cabin, or its future replacement). This gives us more flexibility to accommodate different groups on the property, and ensures that Camelot will remain available even while one of the two structures is closed for repair or replacement.

    - question: Why does MITOC need the bunkhouse?
      answer: |
        Building a new structure at Camelot is the best way to ensure that the MITOC cabin experience will remain available to future generations of MIT students. The existing cabin is nearing the end of its usable life as a place to sleep. Its loft had to be closed recently because it did not meet modern safety standards, and it reopened only after a major repair effort by the cabin managers. Patches like this can only go so far. Today the cabin sleeps %capacity_now% people across the loft, living room, and kitchen, and within a few years it will no longer be safe to sleep in. We will rely on the new bunkhouse to provide safe and comfortable sleeping space for %bunkhouse_capacity% Outing Club members.

    - question: How does the bunkhouse support MITOC’s mission?
      answer: |
        The core of MITOC’s mission is to make outdoor recreation accessible to all, with a special focus on new students who do not have previous outdoors experience. For this reason, it is important to have a place where MITOC members can sleep in all seasons which is inexpensive and does not require experience nor special equipment.

    - question: Why doesn’t the bunkhouse include a kitchen or lounge area?
      answer: |
        We would prefer to have our sleeping space and living space in separate structures, which will improve the cabin experience for large groups with varied schedules. We believe that the existing cabin will continue to provide a serviceable kitchen and lounge for another 10-20 years, even once it's no longer used for sleeping, and having the bunkhouse in operation will ease the impact of its future replacement.

    - question: Can the existing cabin be brought up to code?
      answer: |
        Not as sleeping space for a large group. Making the existing cabin sleep %bunkhouse_capacity% people would mean bringing it up to current code for lodging, with sprinklers, fire-rated sleeping rooms, and emergency exits. The Camelot managers and the town of Groton found no viable way to do that, and building new is the more cost-effective option. With ongoing repairs and improvements, the existing cabin will remain suitable for use as a cooking and gathering space.

    - question: Why not buy a house instead?
      answer: |
        The safety requirements for a structure that can legally sleep %bunkhouse_capacity% people are quite different from the safety requirements for a single-family residence. The cost of the necessary modifications to a typical house would be a large fraction of the cost of building a new bunkhouse. We also want to preserve the special outdoor space and rustic atmosphere of MITOC cabins.

    - question: Why not use prefab structures, tiny houses, or yurts?
      answer: |
        Yurts and prefab buildings cost much less up front, but they don't meet our long-term club needs. Our main concerns are durability, codes/safety, and heating, as well as our experience at Intervale, which has a (non-heated) yurt.

        While yurts and prefab buildings are significantly cheaper, they don’t last nearly as long, especially under heavy use through harsh New England winters. Based on our experience with yurts at Intervale, we expect a yurt to last a decade or two at most. Building and maintaining a yurt village at Camelot would require a new construction project every several years. Instead, we want to make a generational investment through a permanent structure that better meets club needs and lasts a century or more.

        Building new sleeping space for %bunkhouse_capacity% club members requires meeting modern building codes and MIT's standards for facilities which house students. These have come a long way since 1973!

        Additionally, yurts are hard to keep warm (inefficient and poorly insulated) and usually rely on wood stoves if heated. This means keyholders need fire safety training, which is a current pain point with the current Camelot cabin, as well as an ongoing risk of fire. Because the bunkhouse will be well-insulated and energy efficient, it won't require much electric heat to stay warm when in use, and use won't require fire safety training.

        We have also found that the Intervale yurt sees relatively little use. Given the choice, most people would rather sleep in the cabin, even in the summer when heating is not a priority.

    - question: Why not buy new land for a bunkhouse somewhere else?
      answer: |
        The current Camelot property meets the needs of the club. Although it is about an hour away from the higher peaks of the White Mountains, this distance does not pose difficulty for running hiking trips out of Camelot. We do not wish to give up on the existing improvements to Camelot nor our working relationship with the local authorities. And, we like the neighborhood, including the Rumney cliffs, Sculptured Rocks, and the wonderful new Green Woodlands preserve.

- id: cost
  title: Cost and funding
  questions:
    - question: How much will the new bunkhouse cost?
      answer: |
        The bunkhouse project will cost %total_cost% in total. That covers Phase 1 (the new parking lot, bridge, and access trail, and the final construction drawings, completed in 2025) and Phase 2 (construction of the bunkhouse itself). We updated this estimate in 2026, using initial quotes from general contractors based on the finished construction drawings.

    - question: What does the %total_cost% cover?
      old_ids: [what-expenses-are-not-included-in-the-13-million-estimated-cost]
      answer: |
        The %total_cost% covers the whole project:
        * Construction of the new parking lot, which the town of Groton requested as a condition for granting our zoning exemption for the property.
        * Construction of the access trail and bridge to the bunkhouse site.
        * Initial site preparation.
        * Construction of the bunkhouse itself.
        * Design and project support from architects, structural and geotechnical engineers, MIT Facilities, and others.

        The initial design work with Maclay Architects (Phase 0, 2019–2021) was funded and completed before the fundraising campaign launched, so it isn't part of the %total_cost%.

    - question: How will the bunkhouse be funded?
      answer: |
        Construction of the bunkhouse will be fully funded by donations. Once completed, ongoing maintenance of the bunkhouse will be funded by user fees, in accordance with MITOC’s current practices. We anticipate charging %nightly_fee% per person per night, in line with the current cabin fee.

        Camelot sees roughly 1,000 person-nights of use each year, about half of them from circuses alone. Spread over a 100-year lifespan, a $1 million bunkhouse works out to about $10 per person per night: the same as today’s cabin fee, and well below a bunk at a White Mountains hostel (from about $40) or a Randolph Mountain Club cabin ($30–$50). Unlike those, the bunkhouse will be reserved for the MITOC community.

