# Camelot bunkhouse FAQs, rendered by _pages/camelot/faqs.md
#
# Each group becomes a section with an entry in the jump list at the top of the page.
#   id:        URL anchor for the group (e.g. /camelot/faqs#donating)
#   title:     group heading
#   questions: list of question/answer pairs
#     old_ids:  (optional) anchor IDs this question had before its wording
#               changed, so old links like /camelot/faqs#old-id still land here
#
