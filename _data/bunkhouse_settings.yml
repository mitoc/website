# Wording taken from the committee's own text. Shown on Home, About and (what_is_camelot)
# the homepage banner. Write facts as %key% (see facts: above). Insert with:
#   {% include bunkhouse_summary.html part='what_is_camelot' %}
#   {% include bunkhouse_summary.html part='why' %}
summary:
  what_is_camelot: "For over 50 years, the MIT Outing Club's Camelot cabin has been a vital resource and center of the club's activities. Set on about 20 acres near Rumney, NH, Camelot hosts official club circuses, open cabins, and social events and is a base camp for individual club members using the cabin for personal adventures. Camelot sees over 1000 person-nights each year, and many MITOC members are first introduced to outdoor recreation and the club community through Camelot-based events."
  why: "The existing cabin is nearing the end of its usable life. Camelot was built in 1973, largely by MIT undergrads, and will not remain safe to sleep in for much longer. The new bunkhouse will give MITOC safe, comfortable sleeping space for %bunkhouse_capacity% people."
