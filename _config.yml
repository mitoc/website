# This file is *NOT* reloaded automatically when you use 'jekyll serve'.
# If you change this file, please restart the server process.

title: MIT Outing Club
url: https://mitoc.mit.edu

include: ['_pages', '_redirects']

plugins:
  - jekyll-jolt
  - jekyll-sitemap
  - jekyll-target-blank

# Camelot bunkhouse progress posts: _camelot_updates/YYYY-MM-DD-short-name.md
# How to add one: _camelot_updates/how-to-add-a-bunkhouse-update.md
collections:
  camelot_updates:
    output: true
    permalink: /camelot/updates/:title/

exclude:
  - README.md
  - .circleci
  - vendor
  - tools
  - images/bunkhouse/Images and assets
  - _camelot_updates/how-to-add-a-bunkhouse-update.md

defaults:
  -
    scope:
      path: "_pages" # all files in the project
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "camelot_updates"
    values:
      layout: "camelot_update"

webrick:
  headers:
    Access-Control-Allow-Origin: "*"